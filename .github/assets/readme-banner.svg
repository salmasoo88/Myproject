<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Research Impact Globe</title>
  <desc id="desc">A dark teal banner with a connected digital globe and research location markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041B2D"/><stop offset="0.55" stop-color="#0B3C5D"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".28"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#CFFAFE" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/><rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="190" cy="160" r="150" fill="url(#halo)"/>
  <g transform="translate(65 35)" fill="none" stroke="url(#line)">
    <circle cx="125" cy="125" r="102" stroke-width="4"/>
    <ellipse cx="125" cy="125" rx="48" ry="102" stroke-width="2" opacity=".75"/>
    <ellipse cx="125" cy="125" rx="102" ry="42" stroke-width="2" opacity=".75"/>
    <path d="M23 125H227M125 23V227" stroke-width="2" opacity=".45"/>
    <g fill="#FBBF24" stroke="#0F2740" stroke-width="3">
      <circle cx="76" cy="73" r="8"/><circle cx="161" cy="91" r="8"/><circle cx="105" cy="170" r="8"/><circle cx="185" cy="160" r="8"/>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="350" y="105" fill="#5EEAD4" font-size="18" font-weight="700" letter-spacing="4">INTERACTIVE RESEARCH VISUALISATION</text>
    <text x="346" y="174" fill="#FFFFFF" font-size="55" font-weight="800">RESEARCH IMPACT GLOBE</text>
    <rect x="350" y="197" width="170" height="4" rx="2" fill="url(#line)"/>
    <text x="350" y="246" fill="#C7DFF2" font-size="23">Explore projects, people, and impact around the world</text>
  </g>
  <g fill="#5EEAD4" opacity=".65"><circle cx="1090" cy="60" r="5"/><circle cx="1030" cy="250" r="5"/><circle cx="1140" cy="175" r="5"/></g>
  <path d="M1200 60H1090L1040 110H980M1200 175H1140L1100 215M1200 280H1060L1030 250" fill="none" stroke="#60A5FA" stroke-width="2" opacity=".38"/>
  <rect x="2" y="2" width="1196" height="316" rx="26" fill="none" stroke="#5EEAD4" stroke-opacity=".2" stroke-width="2"/>
</svg>
